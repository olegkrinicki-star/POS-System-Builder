# Render Blueprint — POS-System-Builder
# Deploy: Render Dashboard → New + → Blueprint → подключить этот репозиторий.
# После создания заполните DATABASE_URL (sync: false) в настройках maradi-pos-api.
#
# ВАЖНО: если Render выдаст сервисам другие имена/URL — поправьте значения
# CORS_ORIGIN (ниже) и VITE_API_URL на фактические адреса и пересинхронизируйте
# Blueprint (или отредактируйте env-переменные в Dashboard).

services:
  # ---------- Бэкенд: Web Service (Express API) ----------
  - type: web
    name: maradi-pos-api
    runtime: node
    region: frankfurt   # рядом с Neon (eu-central-1, Frankfurt)
    plan: free
    branch: main
    healthCheckPath: /api/healthz
    # pnpm ставим сами (закреплённая major-версия 12, как в lockfile),
    # SKIP_INSTALL_DEPS отключает автоустановку Render с непредсказуемой
    # версией pnpm, которая может не понять pnpm-workspace.yaml.
    buildCommand: npm i -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Подпись cookie-сессии: Render сгенерирует и сохранит значение.
      - key: SESSION_SECRET
        generateValue: true
      # Строка подключения к Neon — вставляется в Dashboard (пароль не в git).
      - key: DATABASE_URL
        sync: false
      # URL фронтенда — переключает бэкенд в кросс-доменный режим
      # (CORS с credentials + cookie SameSite=None).
      - key: CORS_ORIGIN
        value: https://maradi-pos-web.onrender.com

  # ---------- Фронтенд: Static Site (Vite/React) ----------
  - type: web
    name: maradi-pos-web
    runtime: static
    branch: main
    buildCommand: npm i -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter @workspace/maradi-pos run build
    staticPublishPath: artifacts/maradi-pos/dist/public
    # SPA-роутинг: любые пути (например /shift) отдаются index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Кэш неизменяемых ассетов Vite.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # URL бэкенда вшивается в сборку Vite (build-time).
      - key: VITE_API_URL
        value: https://maradi-pos-api.onrender.com
