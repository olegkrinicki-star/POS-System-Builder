openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pos
    description: Hookah lounge point of sale
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pos/session:
    get:
      operationId: getPosSession
      tags: [pos]
      summary: Get the current POS session
      responses:
        "200":
          description: Current role, or no active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"
    delete:
      operationId: logoutPos
      tags: [pos]
      summary: End the current POS session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"
  /pos/login:
    post:
      operationId: loginPos
      tags: [pos]
      summary: Sign in with a four-digit POS PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"
        "401":
          description: Incorrect PIN
  /pos/state:
    get:
      operationId: getPosState
      tags: [pos]
      summary: Load settings, menu, inventory, and shift history
      responses:
        "200":
          description: POS application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosState"
    put:
      operationId: savePosState
      tags: [pos]
      summary: Save POS state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosState"
      responses:
        "200":
          description: Saved POS application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosState"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PosLoginInput:
      type: object
      properties:
        pin:
          type: string
          pattern: "^\\d{4}$"
      required: [pin]
    PosSession:
      type: object
      properties:
        authenticated:
          type: boolean
        role:
          type: ["string", "null"]
          enum: [admin, worker, null]
      required: [authenticated, role]
    MenuItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, minimum: 0 }
        # Норму чаши задаёт владелец: любые целые 1–100 г (а не только 24–27).
        tobaccoGrams: { type: integer, minimum: 1, maximum: 100 }
        enabled: { type: boolean }
        salaryBonus: { type: number, minimum: 0 }
      required: [id, name, price, tobaccoGrams, enabled]
    WorkerPermissions:
      type: object
      properties:
        menuItemIds:
          type: array
          items: { type: string }
        seeRevenue: { type: boolean }
        useDiscounts: { type: boolean }
        addInventory: { type: boolean }
        editPastInventory: { type: boolean }
        editPastShifts: { type: boolean }
      required: [menuItemIds, seeRevenue, useDiscounts, addInventory, editPastInventory, editPastShifts]
    InventoryItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        packageGrams: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0 }
        unit: { type: string }
      required: [id, name, category, brand, packageGrams, stock, unit]
    Container:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tareGrams: { type: number, minimum: 0 }
      required: [id, name, tareGrams]
    Employee:
      type: object
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        baseSalary: { type: number, minimum: 0 }
        highVolumeSalary: { type: number, minimum: 0 }
      required: [id, name, baseSalary, highVolumeSalary]
    ShiftLine:
      type: object
      properties:
        id: { type: string }
        menuItemId: { type: string }
        menuItemName: { type: string }
        unitPrice: { type: number, minimum: 0 }
        # Строка смены повторяет норму позиции меню (1–100 г).
        tobaccoGrams: { type: integer, minimum: 1, maximum: 100 }
        discount: { type: number, enum: [0, 50, 100] }
        reason: { type: string }
      required: [id, menuItemId, menuItemName, unitPrice, tobaccoGrams, discount, reason]
    Shift:
      type: object
      properties:
        id: { type: string }
        date: { type: string }
        master: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ShiftLine" }
        helpersPay: { type: number, minimum: 0 }
        purchaseAmount: { type: number, minimum: 0 }
        comment: { type: string }
        fixedSalary: { type: ["number", "null"], minimum: 0 }
        rebuilds: { type: integer, minimum: 0 }
        createdAt: { type: string }
      required: [id, date, master, lines, helpersPay, comment, fixedSalary, createdAt]
    PosState:
      type: object
      properties:
        menu:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
        permissions:
          $ref: "#/components/schemas/WorkerPermissions"
        inventory:
          type: array
          items: { $ref: "#/components/schemas/InventoryItem" }
        containers:
          type: array
          items: { $ref: "#/components/schemas/Container" }
        employees:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        shifts:
          type: array
          items: { $ref: "#/components/schemas/Shift" }
        # Отдельные выплаты/корректировки Амиду (не привязаны к сменам).
        amidAdjustments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              date: { type: string }
              amount: { type: number, minimum: 0 }
              comment: { type: string }
              createdAt: { type: string }
            required: [id, date, amount, createdAt]
        # Редактируемый блок «Правила расчёта» на странице смены.
        calculationRules:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, minimum: 1 }
              name: { type: string }
              rule: { type: string }
            required: [id, name, rule]
        # Динамические коэффициенты списания сырья: администратор меняет их в
        # настройках, они применяются ко всем новым операциям и хранятся в БД.
        usageSettings:
          $ref: "#/components/schemas/UsageSettings"
        # Конструктор правил списания: базовые коэффициенты (usageSettings)
        # плюс собственные правила администратора, привязанные к складу.
        usageRules:
          type: array
          items: { $ref: "#/components/schemas/UsageRule" }
        # Журнал автоматических списаний: каждая закрытая смена даёт запись с
        # формулой расчёта и раскладкой расхода по складским позициям.
        usageLog:
          type: array
          items: { $ref: "#/components/schemas/UsageLogEntry" }
        coalOpeningKg: { type: number, minimum: 0 }
        updatedAt: { type: string }
      # amidAdjustments, calculationRules, usageSettings, usageRules и usageLog
      # необязательны: старые сохранённые состояния их не содержат.
      required: [menu, permissions, inventory, containers, shifts, coalOpeningKg, updatedAt]
    UsageSettings:
      type: object
      properties:
        # кг угля на один кальян
        coalKgPerHookah: { type: number, minimum: 0 }
        # кг угля на один перезабив
        coalKgPerRebuild: { type: number, minimum: 0 }
        # г табака на один забив/перезабив
        tobaccoGramsPerRebuild: { type: number, minimum: 0 }
      required: [coalKgPerHookah, coalKgPerRebuild, tobaccoGramsPerRebuild]
    UsageRule:
      type: object
      properties:
        id: { type: string }
        # Название правила, например «Расход на фруктовую чашу».
        name: { type: string }
        # Целевая позиция склада (материал), списывается расход правила.
        inventoryId: { type: string }
        # Расход за одну операцию в единицах позиции склада (г или кг).
        amount: { type: number, minimum: 0 }
        # sale — при продаже позиции, rebuild — при перезабиве.
        operation: { type: string, enum: [sale, rebuild] }
        # Для operation=sale: только строки этой позиции меню; null — любые.
        menuItemId: { type: [string, "null"] }
        enabled: { type: boolean }
      required: [id, name, inventoryId, amount, operation, enabled]
    UsageLogEntry:
      type: object
      properties:
        id: { type: string }
        shiftId: { type: string }
        date: { type: string }
        # Закрытые кальяны и перезабивки смены (для колонки «Списано за смену»).
        hookahCount: { type: integer, minimum: 0 }
        rebuildCount: { type: integer, minimum: 0 }
        coalKg: { type: number, minimum: 0 }
        tobaccoGrams: { type: number, minimum: 0 }
        # Формула расчёта с фактическими коэффициентами на момент списания.
        coalFormula: { type: string }
        tobaccoFormula: { type: string }
        # Какими правилами (базовыми или созданными вручную) списано сырьё.
        sources:
          type: array
          items:
            type: object
            properties:
              ruleId: { type: string }
              ruleName: { type: string }
              amount: { type: number, minimum: 0 }
              unit: { type: string }
            required: [ruleId, ruleName, amount, unit]
        # Раскладка списания по складским позициям (для колонки «Списано»).
        items:
          type: array
          items:
            type: object
            properties:
              inventoryId: { type: string }
              name: { type: string }
              coalKg: { type: number, minimum: 0 }
              tobaccoGrams: { type: number, minimum: 0 }
              # Сумма в единицах самой позиции (для любых категорий склада).
              amount: { type: number, minimum: 0 }
              unit: { type: string }
            required: [inventoryId, name, coalKg, tobaccoGrams]
        createdAt: { type: string }
      required:
        - id
        - shiftId
        - date
        - hookahCount
        - rebuildCount
        - coalKg
        - tobaccoGrams
        - coalFormula
        - tobaccoFormula
        - createdAt

